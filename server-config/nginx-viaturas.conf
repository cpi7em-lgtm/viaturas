server {

    listen 80;

    server_name _;



    root /usr/share/nginx/html;

    index index.html;

    charset utf-8;



    # ====== GZIP COMPRESSION ======

    gzip on;

    gzip_vary on;

    gzip_min_length 1024;

    gzip_proxied any;

    gzip_comp_level 6;

    gzip_types

        text/plain

        text/css

        text/xml

        application/javascript

        application/json

        application/xml

        application/xml+rss

        image/svg+xml;



    types {

        text/html                             html htm shtml;

        text/css                              css;

        text/xml                              xml;

        application/javascript                js mjs;

        application/json                      json;

        image/png                             png;

        image/jpeg                            jpg jpeg;

        image/gif                             gif;

        image/svg+xml                         svg svgz;

        image/webp                            webp;

        image/x-icon                          ico;

        font/woff                             woff;

        font/woff2                            woff2;

        application/octet-stream              *;

    }

    default_type application/octet-stream;



    # ====== CONVEX SYNC (WebSocket) ======

    location ~ ^/api/(1\.[0-9]+\.[0-9]+/sync|query|mutation|delete|action) {

        proxy_pass http://convex-backend-viaturas:3210;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;

        proxy_read_timeout 60s;

    }



    # ====== AUTH API (Python FastAPI) ======

    # Endpoints do convex deploy/push

    location ~ ^/api/(get_config_hashes|version|get_version|whoami|deploy2|import|current_deployment|deployment|export|function|insights|diagnostic_report|teams|telemetry) {

        proxy_pass http://convex-backend-viaturas:3210;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_read_timeout 120s;

    }



    # Demais rotas /api/ vao pro auth-api

    location /api/ {

        proxy_pass http://auth-api-viaturas:8082/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 180s;

        proxy_connect_timeout 15s;

        proxy_send_timeout 180s;

        }



    # ====== Convex Backend ======

    location /convex/ {

        rewrite ^/convex/(.*)$ /$1 break;

        proxy_pass http://convex-backend-viaturas:3210;

        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;

        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;

        proxy_set_header X-Real-IP $remote_addr;

        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_buffering off;

    }



    # ====== Static Assets (bundle JS) ======

    location /assets/ {

        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;

        add_header Pragma "no-cache" always;

        add_header Expires "0" always;

        try_files $uri =404;

    }

    location = /favicon.png {

        add_header Cache-Control "public, max-age=3600";

    }

    location = /Brasao.jpg {

        add_header Cache-Control "public, max-age=3600";

    }



    # ====== ROOT: TELA DE LOGIN ======

    location = / {

        try_files /index.html =404;

    }

    location / {

        try_files $uri $uri/ /index.html;

    }

}
